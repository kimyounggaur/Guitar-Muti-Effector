<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Production offline readiness</title></head><body>
<h1>Production offline readiness</h1><button id="check">캐시 검사</button><pre id="result" role="status">준비</pre><script type="module">
const result=document.querySelector('#result'); document.querySelector('#check').addEventListener('click',async()=>{try{const registration=await navigator.serviceWorker.getRegistration('/dist/');const keys=await caches.keys();const list=[];for(const name of keys){const cache=await caches.open(name);const entries=await cache.keys();list.push({name,entries:entries.map(x=>new URL(x.url).pathname)});}const manifest=await (await fetch('/dist/manifest.webmanifest')).json();result.textContent=JSON.stringify({scope:registration?.scope,active:registration?.active?.state,waiting:registration?.waiting?.state,installing:registration?.installing?.state,manifest:manifest.name,caches:list},null,2);}catch(e){result.textContent='실패: '+e.message;}});
</script></body></html>
